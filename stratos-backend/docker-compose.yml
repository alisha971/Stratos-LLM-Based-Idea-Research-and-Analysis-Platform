# Local dev dependencies only (B7.1). API + worker run on the host for fast
# iteration; in production the single-container image (Dockerfile) runs both.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stratos
      POSTGRES_USER: stratos
      POSTGRES_PASSWORD: stratos
    ports:
      - "5432:5432"
    volumes:
      - stratos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  stratos_pg:
